services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatify
      POSTGRES_PASSWORD: seatify
      POSTGRES_DB: seatify
    ports:
      - "5432:5432"
    volumes:
      - seatify_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - seatify_redisdata:/data

volumes:
  seatify_pgdata:
  seatify_redisdata:
